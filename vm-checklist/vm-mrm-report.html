<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VM MRM Report — BSC The Textile Mall</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1E2D5A;--navy-d:#151F3E;--navy-l:#EEF1FB;
  --gold:#B8860B;--gold-l:#FEF3C7;
  --crimson:#C0392B;--crimson-l:#FEE2E2;
  --green:#1E7A1E;--green-l:#D1FAE5;
  --orange:#D97706;--orange-l:#FEF3C7;
  --ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-30:rgba(26,26,46,.3);
  --ivory:#F9F7F0;--white:#FFFFFF;--border:#E8E4D8;
}
body{font-family:Cambria,Georgia,serif;background:var(--ivory);color:var(--ink);min-height:100vh}

/* ── PASSWORD SCREEN ───────────────────────────── */
#pwScreen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999}
.pw-box{background:var(--white);border-radius:20px;padding:40px 32px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.pw-logo{width:80px;height:80px;border-radius:16px;overflow:hidden;margin:0 auto 20px;border:2px solid var(--border)}
.pw-logo img{width:100%;height:100%;object-fit:cover}
.pw-title{font-size:22px;color:var(--navy);margin-bottom:6px}
.pw-sub{font-size:13px;color:var(--ink-60);margin-bottom:24px}
.pw-input{width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:15px;font-family:Cambria,serif;letter-spacing:.1em;margin-bottom:12px;text-align:center}
.pw-input:focus{border-color:var(--navy);outline:none}
.pw-btn{width:100%;padding:13px;border-radius:10px;background:var(--navy);color:var(--white);font-size:15px;font-weight:700;font-family:Cambria,serif;border:none;cursor:pointer}
.pw-error{font-size:13px;color:var(--crimson);margin-top:10px;min-height:20px}

/* ── TOP CONTROLS ──────────────────────────────── */
#app{display:none}
.controls{background:var(--navy);padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.controls-brand{display:flex;align-items:center;gap:10px;flex:1}
.controls-logo{width:32px;height:32px;border-radius:8px;overflow:hidden;flex-shrink:0}
.controls-logo img{width:100%;height:100%;object-fit:cover}
.controls-title{font-size:16px;color:var(--white);font-weight:700}
.controls-sub{font-size:11px;color:rgba(255,255,255,.55)}
.ctrl-group{display:flex;align-items:center;gap:8px}
.ctrl-label{font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap}
.ctrl-select{padding:7px 12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--white);font-size:12px;font-family:Cambria,serif;cursor:pointer}
.ctrl-select option{background:var(--navy-d);color:var(--white)}
.ctrl-date{padding:7px 12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--white);font-size:12px;font-family:Cambria,serif}
.ctrl-btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;font-family:Cambria,serif;border:none;cursor:pointer;display:flex;align-items:center;gap:6px}
.ctrl-btn.apply{background:var(--gold);color:var(--white)}
.ctrl-btn.pdf{background:var(--crimson);color:var(--white)}
.ctrl-btn.view{background:var(--green);color:var(--white)}

/* ── PAGES ─────────────────────────────────────── */
.report{max-width:900px;margin:0 auto;padding:24px}
.page{background:var(--white);border-radius:16px;margin-bottom:24px;overflow:hidden;box-shadow:0 2px 16px rgba(26,26,46,.08);page-break-after:always}

/* ── PAGE 1 COVER ──────────────────────────────── */
.cover{background:var(--navy);min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 40px;position:relative;overflow:hidden}
.cover::before{content:'';position:absolute;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:rgba(184,134,11,.1)}
.cover::after{content:'';position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04)}
.cover-logo{width:100px;height:100px;border-radius:20px;overflow:hidden;margin:0 auto 28px;border:3px solid rgba(255,255,255,.2)}
.cover-logo img{width:100%;height:100%;object-fit:cover}
.cover-tag{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px}
.cover-title{font-size:38px;color:var(--white);line-height:1.2;margin-bottom:8px}
.cover-sub{font-size:20px;color:var(--gold);margin-bottom:6px}
.cover-period{font-size:15px;color:rgba(255,255,255,.6);margin-bottom:32px}
.cover-divider{width:60px;height:2px;background:var(--gold);margin:0 auto 32px}
.cover-prepared{font-size:13px;color:rgba(255,255,255,.4)}
.cover-prepared span{color:rgba(255,255,255,.7)}

/* ── PAGE HEADER ───────────────────────────────── */
.page-header{background:var(--navy);padding:24px 32px;display:flex;align-items:center;justify-content:space-between}
.page-header-title{font-size:20px;color:var(--white)}
.page-header-num{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.1em}
.page-body{padding:32px}

/* ── EXECUTIVE SUMMARY ─────────────────────────── */
.health-score-wrap{display:flex;align-items:center;gap:24px;margin-bottom:28px}
.health-circle{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:6px solid var(--navy)}
.health-num{font-size:32px;font-weight:700;color:var(--navy);line-height:1}
.health-label{font-size:11px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.08em}
.health-desc{flex:1}
.health-desc h3{font-size:18px;color:var(--navy);margin-bottom:6px}
.health-desc p{font-size:13px;color:var(--ink-60);line-height:1.6}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.kpi-card{background:var(--ivory);border-radius:12px;padding:14px 16px;border:1.5px solid var(--border)}
.kpi-card-label{font-size:11px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi-card-val{font-size:22px;font-weight:700;color:var(--navy);line-height:1}
.kpi-card-sub{font-size:11px;margin-top:4px}
.kpi-card-sub.good{color:var(--green)}
.kpi-card-sub.warn{color:var(--orange)}
.kpi-card-sub.bad{color:var(--crimson)}
.wins-concerns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wins-box{background:var(--green-l);border-radius:12px;padding:16px;border:1.5px solid var(--green)}
.concerns-box{background:var(--crimson-l);border-radius:12px;padding:16px;border:1.5px solid var(--crimson)}
.box-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.wins-box .box-title{color:var(--green)}
.concerns-box .box-title{color:var(--crimson)}
.box-item{font-size:13px;color:var(--ink);margin-bottom:6px;display:flex;align-items:flex-start;gap:6px;line-height:1.4}

/* ── SCORE TREND ───────────────────────────────── */
.trend-chart{height:160px;display:flex;align-items:flex-end;gap:3px;padding:10px 0;border-bottom:2px solid var(--border);margin-bottom:12px}
.trend-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.trend-bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .4s ease}
.trend-bar.good{background:var(--navy)}
.trend-bar.warn{background:var(--orange)}
.trend-bar.bad{background:var(--crimson)}
.trend-bar.na{background:var(--border)}
.trend-label{font-size:9px;color:var(--ink-30);white-space:nowrap}
.trend-score{font-size:9px;color:var(--ink-60);font-weight:700}
.weekly-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.week-card{background:var(--ivory);border-radius:10px;padding:12px;text-align:center;border:1.5px solid var(--border)}
.week-card-label{font-size:11px;color:var(--ink-60);margin-bottom:4px}
.week-card-score{font-size:20px;font-weight:700;color:var(--navy)}
.compliance-wrap{display:flex;align-items:center;gap:20px;background:var(--navy-l);border-radius:12px;padding:16px}
.compliance-big{font-size:36px;font-weight:700;color:var(--navy);flex-shrink:0}
.compliance-info h4{font-size:14px;color:var(--navy);margin-bottom:4px}
.compliance-info p{font-size:12px;color:var(--ink-60)}

/* ── ASPECT TABLE ──────────────────────────────── */
.aspect-table{width:100%;border-collapse:collapse}
.aspect-table th{background:var(--navy);color:var(--white);padding:10px 14px;font-size:12px;text-align:left;font-weight:600}
.aspect-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.aspect-table tr:nth-child(even) td{background:var(--ivory)}
.bar-cell{width:160px}
.bar-bg{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-fill.good{background:var(--green)}
.bar-fill.warn{background:var(--orange)}
.bar-fill.bad{background:var(--crimson)}
.score-pill{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700}
.score-pill.good{background:var(--green-l);color:var(--green)}
.score-pill.warn{background:var(--orange-l);color:var(--orange)}
.score-pill.bad{background:var(--crimson-l);color:var(--crimson)}
.rank-badge{width:24px;height:24px;border-radius:6px;background:var(--crimson);color:var(--white);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* ── FLOOR SECTION ─────────────────────────────── */
.floor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.floor-card{background:var(--ivory);border-radius:12px;padding:16px;text-align:center;border:1.5px solid var(--border)}
.floor-card.best{border-color:var(--green);background:var(--green-l)}
.floor-card.worst{border-color:var(--crimson);background:var(--crimson-l)}
.floor-name{font-size:11px;font-weight:700;color:var(--ink-60);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.floor-score-big{font-size:26px;font-weight:700;color:var(--navy)}
.floor-score-big.best{color:var(--green)}
.floor-score-big.worst{color:var(--crimson)}
.floor-comp{font-size:11px;color:var(--ink-60);margin-top:4px}
.floor-bar-chart{margin-bottom:24px}
.floor-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.floor-bar-label{font-size:13px;color:var(--ink);width:100px;flex-shrink:0}
.floor-bar-bg{flex:1;height:20px;border-radius:6px;background:var(--border);overflow:hidden}
.floor-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
.floor-bar-val{font-size:13px;font-weight:700;color:var(--navy);width:40px;text-align:right;flex-shrink:0}

/* ── NO ANSWERS ────────────────────────────────── */
.fail-table{width:100%;border-collapse:collapse}
.fail-table th{background:var(--crimson);color:var(--white);padding:10px 14px;font-size:12px;text-align:left}
.fail-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.fail-table tr:nth-child(even) td{background:var(--ivory)}
.fail-count{background:var(--crimson-l);color:var(--crimson);font-weight:700;padding:2px 8px;border-radius:6px;font-size:12px}

/* ── PHOTO SUMMARY ─────────────────────────────── */
.photo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.photo-card{background:var(--ivory);border-radius:10px;padding:14px;text-align:center;border:1.5px solid var(--border)}
.photo-num{font-size:24px;font-weight:700;color:var(--navy);margin-bottom:4px}
.photo-label{font-size:11px;color:var(--ink-60)}
.drive-link-box{background:var(--navy-l);border-radius:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--navy)}
.drive-link-text{font-size:13px;color:var(--navy)}
.drive-link-btn{padding:8px 14px;border-radius:8px;background:var(--navy);color:var(--white);font-size:12px;font-weight:700;text-decoration:none}

/* ── WOW TABLE ─────────────────────────────────── */
.wow-table{width:100%;border-collapse:collapse}
.wow-table th{background:var(--gold);color:var(--white);padding:10px 14px;font-size:12px;text-align:left}
.wow-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);text-align:center}
.wow-table td:first-child{text-align:left}
.wow-table tr:nth-child(even) td{background:var(--ivory)}
.trend-arrow.up{color:var(--green)}
.trend-arrow.down{color:var(--crimson)}
.trend-arrow.flat{color:var(--orange)}

/* ── ACTION ITEMS ──────────────────────────────── */
.action-table{width:100%;border-collapse:collapse}
.action-table th{background:var(--navy);color:var(--white);padding:10px 14px;font-size:12px;text-align:left}
.action-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:top}
.action-table tr:nth-child(even) td{background:var(--ivory)}
.priority-badge{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.priority-badge.high{background:var(--crimson-l);color:var(--crimson)}
.priority-badge.medium{background:var(--orange-l);color:var(--orange)}
.priority-badge.low{background:var(--green-l);color:var(--green)}
.obs-area{width:100%;min-height:80px;border:1.5px solid var(--border);border-radius:8px;padding:10px;font-family:Cambria,serif;font-size:13px;background:var(--ivory);resize:vertical}

/* ── TARGETS PAGE ──────────────────────────────── */
.targets-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.target-card{background:var(--ivory);border-radius:12px;padding:18px;border:1.5px solid var(--border)}
.target-card-label{font-size:12px;color:var(--ink-60);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.target-current{font-size:14px;color:var(--ink-60);margin-bottom:4px}
.target-next{font-size:22px;font-weight:700;color:var(--navy)}
.target-arrow{color:var(--gold);margin:0 6px}
.sign-area{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}
.sign-box{border-top:2px solid var(--border);padding-top:12px}
.sign-label{font-size:12px;color:var(--ink-60)}

/* ── UTILITIES ─────────────────────────────────── */
.section-title{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--navy)}
.divider{height:1px;background:var(--border);margin:24px 0}
.tag{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700}
.tag.good{background:var(--green-l);color:var(--green)}
.tag.warn{background:var(--orange-l);color:var(--orange)}
.tag.bad{background:var(--crimson-l);color:var(--crimson)}
.loader{display:flex;flex-direction:column;align-items:center;padding:80px;gap:16px}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite}
.loader p{font-size:14px;color:var(--ink-60)}

/* ── PRINT ─────────────────────────────────────── */
@media print {
  body{background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .controls{display:none!important}
  .page{box-shadow:none;margin-bottom:0;border-radius:0;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto}
  /* Darken light backgrounds for print */
  .kpi-card{background:#E8E4D8!important;border:1.5px solid #1E2D5A!important}
  .wins-box{background:#C8F0C8!important;border:1.5px solid #1E7A1E!important}
  .concerns-box{background:#F8C8C8!important;border:1.5px solid #C0392B!important}
  .week-card{background:#E8E4D8!important}
  .floor-card{background:#E8E4D8!important}
  .floor-card.best{background:#C8F0C8!important}
  .floor-card.worst{background:#F8C8C8!important}
  .compliance-wrap{background:#D0D8F0!important}
  .target-card{background:#E8E4D8!important}
  .photo-card{background:#E8E4D8!important}
  .drive-link-box{background:#D0D8F0!important}
  .score-pill.good{background:#C8F0C8!important;color:#0A5A0A!important}
  .score-pill.warn{background:#FFE0A0!important;color:#8B4500!important}
  .score-pill.bad{background:#F8C8C8!important;color:#8B0000!important}
  .bar-fill.good{background:#1E7A1E!important}
  .bar-fill.warn{background:#D97706!important}
  .bar-fill.bad{background:#C0392B!important}
  .trend-bar.good{background:#1E2D5A!important}
  .trend-bar.warn{background:#D97706!important}
  .trend-bar.bad{background:#C0392B!important}
  .floor-bar-fill{opacity:1!important}
  .aspect-table tr:nth-child(even) td{background:#F0EDE5!important}
  .fail-table tr:nth-child(even) td{background:#F0EDE5!important}
  .wow-table tr:nth-child(even) td{background:#F0EDE5!important}
  .action-table tr:nth-child(even) td{background:#F0EDE5!important}
  .priority-badge.high{background:#F8C8C8!important;color:#8B0000!important}
  .priority-badge.medium{background:#FFE0A0!important;color:#8B4500!important}
  .priority-badge.low{background:#C8F0C8!important;color:#0A5A0A!important}
  .health-circle{border:6px solid #1E2D5A!important}
  .navy-l,.EEF1FB{background:#D0D8F0!important}
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease}
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="pwScreen">
  <div class="pw-box">
    <div class="pw-logo"><img src="https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg" alt="BSC"/></div>
    <div class="pw-title">VM MRM Report</div>
    <div class="pw-sub">BSC The Textile Mall · Belagavi<br/>Enter password to access</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()"/>
    <button class="pw-btn" onclick="checkPw()">Access Report</button>
    <div class="pw-error" id="pwError"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="controls">
    <div class="controls-brand">
      <div class="controls-logo"><img src="https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg" alt="BSC"/></div>
      <div>
        <div class="controls-title">VM MRM Report</div>
        <div class="controls-sub">BSC The Textile Mall · Belagavi</div>
      </div>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Period</span>
      <select class="ctrl-select" id="periodType" onchange="toggleDateInputs()">
        <option value="month">Monthly</option>
        <option value="custom">Custom Range</option>
      </select>
    </div>
    <div class="ctrl-group" id="monthGroup">
      <input type="month" class="ctrl-date" id="monthPicker"/>
    </div>
    <div class="ctrl-group" id="customGroup" style="display:none">
      <input type="date" class="ctrl-date" id="dateFrom"/>
      <span class="ctrl-label">to</span>
      <input type="date" class="ctrl-date" id="dateTo"/>
    </div>
    <button class="ctrl-btn apply" onclick="generateReport()">▶ Generate</button>
    <button class="ctrl-btn pdf" onclick="window.print()">📄 Download PDF</button>
  </div>

  <div class="report" id="report">
    <div class="loader">
      <div class="spinner"></div>
      <p>Select a period and click Generate to load the report.</p>
    </div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwhLkB_Lp5t8JeM_9ZCq1onID-pDmuKdBE00aGQY6FCFljTNbFaHxOxfSpSoSKRc9xQ/exec";
const PASSWORD = "BSCCANDB";
const FLOORS   = ["Ground Floor","1st Floor","2nd Floor","3rd Floor","4th Floor"];
let _cb = 0, reportData = null;

// ── AUTH ──────────────────────────────────────────────────────
function checkPw() {
  const val = document.getElementById("pwInput").value;
  if (val === PASSWORD) {
    document.getElementById("pwScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    initControls();
  } else {
    document.getElementById("pwError").textContent = "Incorrect password. Try again.";
    document.getElementById("pwInput").value = "";
  }
}

function initControls() {
  const now = new Date();
  const y   = now.getFullYear();
  const m   = String(now.getMonth()+1).padStart(2,"0");
  document.getElementById("monthPicker").value = y+"-"+m;
  document.getElementById("dateFrom").value    = y+"-"+m+"-01";
  document.getElementById("dateTo").value      = now.toISOString().split("T")[0];
}

function toggleDateInputs() {
  const type = document.getElementById("periodType").value;
  document.getElementById("monthGroup").style.display  = type==="month"?"flex":"none";
  document.getElementById("customGroup").style.display = type==="custom"?"flex":"none";
}

// ── DATE RANGE ────────────────────────────────────────────────
function getDateRange() {
  const type = document.getElementById("periodType").value;
  if (type === "month") {
    const val = document.getElementById("monthPicker").value;
    const [y,m] = val.split("-");
    const lastDay = new Date(parseInt(y), parseInt(m), 0).getDate();
    return { from: y+"-"+m+"-01", to: y+"-"+m+"-"+String(lastDay).padStart(2,"0"), label: monthLabel(val) };
  } else {
    const from = document.getElementById("dateFrom").value;
    const to   = document.getElementById("dateTo").value;
    return { from, to, label: formatDateShort(from)+" – "+formatDateShort(to) };
  }
}

function monthLabel(val) {
  const [y,m] = val.split("-");
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return months[parseInt(m)-1]+" "+y;
}

// ── GENERATE REPORT ───────────────────────────────────────────
async function generateReport() {
  const range = getDateRange();
  const el    = document.getElementById("report");
  el.innerHTML = '<div class="loader"><div class="spinner"></div><p>Loading VM data...</p></div>';

  const [overall, floors, history] = await Promise.all([
    apiGet({ action:"get_mrm_overall", from:range.from, to:range.to }),
    apiGet({ action:"get_mrm_floors",  from:range.from, to:range.to }),
    apiGet({ action:"get_history" })
  ]);

  reportData = { overall, floors, history, range };
  renderReport();
}

          <div class="target-card">

          </div>
          <div class="target-card">

            <div class="target-card-label">No Answers</div>

            <div class="target-card">

}

// ── HELPER — HEALTH SCORE ─────────────────────────────────────
function calcHealth(o) {
  if (!o.days_total) return 0;
  const scoreComp   = (o.avg_score / 5) * 40;
  const compComp    = (o.days_filled / o.days_total) * 30;
  const floorComp   = o.floors_total > 0 ? (o.floors_done / o.floors_total) * 20 : 20;
  const failComp    = Math.max(0, 10 - (o.no_count / 10));
  return Math.round(scoreComp + compComp + floorComp + failComp);
}

// ── HELPER — WEEKLY AVERAGES ──────────────────────────────────
function getWeeklyAverages(hist) {
  const weeks = [{days:0,total:0,count:0},{days:0,total:0,count:0},{days:0,total:0,count:0},{days:0,total:0,count:0}];
  hist.forEach(h => {
    const d   = new Date(h.date);
    const day = d.getUTCDate();
    const wi  = Math.min(3, Math.floor((day-1)/7));
    weeks[wi].days++;
    if (h.score !== null) { weeks[wi].total += h.score; weeks[wi].count++; }
  });
  return weeks.map(w => ({ days:w.days, score:w.count>0?Math.round((w.total/w.count)*10)/10:0 }));
}

// ── HELPER — TREND ARROW ──────────────────────────────────────
function getTrend(vals) {
  const valid = vals.filter(v=>v>0);
  if (valid.length<2) return '<span class="trend-arrow flat">→</span>';
  const diff = valid[valid.length-1] - valid[0];
  if (diff > 0.1) return '<span class="trend-arrow up">↑ Improving</span>';
  if (diff < -0.1) return '<span class="trend-arrow down">↓ Declining</span>';
  return '<span class="trend-arrow flat">→ Stable</span>';
}

// ── API ───────────────────────────────────────────────────────
function apiGet(params) {
  return new Promise(resolve => {
    const cb = "mrmCb_"+Date.now()+"_"+(++_cb);
    const sc = document.createElement("script");
    let done = false;
    window[cb] = d => { if(done)return; done=true; delete window[cb]; if(document.body.contains(sc))document.body.removeChild(sc); resolve(d); };
    sc.onerror = () => { if(done)return; done=true; resolve({ok:false,error:"Network error"}); };
    setTimeout(()=>{ if(done)return; done=true; resolve({ok:false,error:"Timeout"}); }, 20000);
    sc.src = API+"?"+new URLSearchParams(params).toString()+"&callback="+cb;
    document.body.appendChild(sc);
  });
}

function formatDateShort(ds) {
  const d=new Date(ds),mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getUTCDate()+" "+mon[d.getUTCMonth()]+" "+d.getUTCFullYear();
}
