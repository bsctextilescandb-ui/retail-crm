<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>BSC VM — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1E2D5A;--navy-d:#151F3E;--navy-l:#EEF1FB;
  --gold:#B8860B;--gold-l:#FEF3C7;
  --crimson:#C0392B;--crimson-l:#FEE2E2;
  --green:#1E7A1E;--green-l:#D1FAE5;
  --orange:#D97706;--orange-l:#FEF3C7;
  --ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-30:rgba(26,26,46,.3);--ink-10:rgba(26,26,46,.06);
  --ivory:#F9F7F0;--white:#FFFFFF;--border:#E8E4D8;
  --shadow:0 2px 12px rgba(26,26,46,.08);--shadow-md:0 4px 24px rgba(26,26,46,.12);
}
html,body{min-height:100vh;background:var(--ivory);
  font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* ── TOPBAR ───────────────────────────────────────── */
.topbar{
  background:var(--navy);padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{
  width:34px;height:34px;border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,.15);flex-shrink:0;
}
.topbar-logo img{width:100%;height:100%;object-fit:cover}
.topbar-title{font-family:'DM Serif Display',serif;color:var(--white);font-size:16px}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.logout-btn{
  padding:6px 12px;border-radius:8px;
  background:rgba(255,255,255,.12);color:var(--white);
  font-size:12px;font-weight:600;font-family:inherit;
  border:none;cursor:pointer;
}

/* ── BODY ─────────────────────────────────────────── */
.body{padding:20px;max-width:560px;margin:0 auto}

/* ── GREETING ─────────────────────────────────────── */
.greeting{
  background:var(--navy);border-radius:18px;
  padding:24px 20px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.greeting::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.05);
}
.greeting::after{
  content:'';position:absolute;bottom:-40px;right:20px;
  width:80px;height:80px;border-radius:50%;
  background:rgba(184,134,11,.1);
}
.greeting-name{
  font-family:'DM Serif Display',serif;font-size:22px;
  color:var(--white);margin-bottom:4px;
}
.greeting-date{font-size:13px;color:rgba(255,255,255,.6)}
.greeting-week{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:12px;padding:6px 12px;border-radius:20px;
  background:rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.8);
}

/* ── SECTION TITLE ────────────────────────────────── */
.section-title{
  font-size:11px;font-weight:700;color:var(--ink-60);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── OVERALL CARD ─────────────────────────────────── */
.overall-card{
  background:var(--white);border-radius:16px;
  border:1.5px solid var(--border);padding:18px;
  margin-bottom:20px;box-shadow:var(--shadow);
}
.overall-card.done{border-color:var(--green)}
.overall-card.pending{border-color:var(--orange)}

.overall-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.overall-label{font-size:14px;font-weight:700;color:var(--ink)}
.overall-badge{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
}
.overall-badge.done{background:var(--green-l);color:var(--green)}
.overall-badge.pending{background:var(--orange-l);color:var(--orange)}

.overall-score{
  font-family:'DM Serif Display',serif;font-size:40px;
  color:var(--navy);line-height:1;
}
.overall-score span{font-size:16px;color:var(--ink-30)}
.overall-score-wrap{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.overall-score-sub{font-size:12px;color:var(--ink-60);padding-bottom:6px}

.three-day-alert{
  background:var(--orange-l);border:1px solid var(--orange);
  border-radius:10px;padding:10px 14px;
  font-size:12px;color:var(--orange);
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
}

.btn-fill{
  width:100%;padding:13px;border-radius:10px;
  background:var(--navy);color:var(--white);
  font-size:14px;font-weight:700;font-family:inherit;
  border:none;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-fill:hover{background:var(--navy-d)}
.btn-fill.done-btn{background:var(--green-l);color:var(--green);cursor:default}
.btn-fill.secondary{background:var(--ivory);color:var(--navy);border:1.5px solid var(--border)}
.btn-fill.secondary:hover{background:var(--navy-l)}

/* ── FLOOR GRID ───────────────────────────────────── */
.floor-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.floor-card{
  background:var(--white);border-radius:14px;
  border:1.5px solid var(--border);padding:16px 18px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);transition:all .2s;
}
.floor-card.done{border-color:var(--green);background:var(--green-l)}
.floor-card.active{cursor:pointer}
.floor-card.active:hover{border-color:var(--navy);background:var(--navy-l)}

.floor-icon{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--ivory);
}
.floor-card.done .floor-icon{background:rgba(30,122,30,.15)}

.floor-info{flex:1}
.floor-name{font-size:14px;font-weight:600;color:var(--ink)}
.floor-card.done .floor-name{color:var(--green)}
.floor-meta{font-size:11px;color:var(--ink-60);margin-top:2px}
.floor-card.done .floor-meta{color:var(--green)}

.floor-right{flex-shrink:0;text-align:right}
.floor-score{
  font-family:'DM Serif Display',serif;font-size:20px;color:var(--green);
}
.floor-score span{font-size:11px;color:var(--green)}
.floor-arrow{font-size:18px;color:var(--ink-30)}

/* ── LOADER ───────────────────────────────────────── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite}
.loader p{font-size:13px;color:var(--ink-60)}

/* ── TOAST ────────────────────────────────────────── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--white);padding:12px 20px;border-radius:10px;
  font-size:13px;font-weight:500;z-index:999;transition:transform .3s ease;
  white-space:nowrap;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green)}
#toast.error{background:var(--crimson)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">
      <img src="https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg" alt="BSC"/>
    </div>
    <div>
      <div class="topbar-title">VM Dashboard</div>
      <div class="topbar-sub">BSC Textiles — Belagavi</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<div class="body" id="body">
  <div class="loader">
    <div class="spinner"></div>
    <p>Loading dashboard...</p>
  </div>
</div>

<canvas id="reportCanvas" style="display:none"></canvas>
<div id="toast"></div>

<div style="text-align:center;padding:24px 20px 32px;border-top:1px solid #E8E4D8;margin-top:8px">
  <div style="font-size:10px;color:rgba(26,26,46,.3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">Powered by</div>
  <img src="https://bsctextilescandb-ui.github.io/retail-crm/cnb-logo.png" alt="C&amp;B" style="height:28px;opacity:.7"/>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwhLkB_Lp5t8JeM_9ZCq1onID-pDmuKdBE00aGQY6FCFljTNbFaHxOxfSpSoSKRc9xQ/exec";

const FLOORS = [
  { name:"Ground Floor", icon:"🏢" },
  { name:"1st Floor",    icon:"1️⃣" },
  { name:"2nd Floor",    icon:"2️⃣" },
  { name:"3rd Floor",    icon:"3️⃣" },
  { name:"4th Floor",    icon:"4️⃣" }
];

let user = null, dashData = null, adminDash = null, reportData = null;
let selectedDate = "", currentTab = "dash", _cbCount = 0;

// ── INIT ──────────────────────────────────────────────────────
window.onload = () => {
  const stored = sessionStorage.getItem("vm_user");
  if (!stored) { window.location.href = "login.html"; return; }
  user = JSON.parse(stored);

  // Set today's date
  const now = new Date();
  const ist = new Date(now.getTime() + (5.5 * 60 * 60 * 1000));
  selectedDate = ist.toISOString().split("T")[0];
  document.getElementById("dateFilter").value = selectedDate;
  document.getElementById("dateFilter").max   = selectedDate;

  loadDashboard();
};

function switchTab(tab) {
  currentTab = tab;
  ["dash","rep"].forEach(t => {
    const el  = document.getElementById("tab-" + t);
    const con = document.getElementById("content-" + t);
    if (t === tab) {
      el.style.color       = "var(--navy)";
      el.style.borderBottom= "2px solid var(--navy)";
      con.style.display    = "block";
    } else {
      el.style.color       = "rgba(26,26,46,.5)";
      el.style.borderBottom= "2px solid transparent";
      con.style.display    = "none";
    }
  });
  if (tab === "rep" && !reportData) loadReports();
}

function onDateChange() {
  selectedDate = document.getElementById("dateFilter").value;
  adminDash = null;
  if (currentTab === "dash") {
    document.getElementById("body").innerHTML = '<div class="loader"><div class="spinner"></div><p>Loading...</p></div>';
    loadDashboard();
  }
}

async function loadDashboard() {
  const data = await apiGet({ action: "get_vm_dashboard", name: user.name });
  if (!data.ok) { showToast("Failed to load dashboard", "error"); return; }
  dashData = data;
  // Also load admin dashboard for score display
  const adm = await apiGet({ action: "get_admin_dashboard", date: selectedDate });
  if (adm.ok) adminDash = adm;
  renderDashboard();
}

async function loadReports() {
  const el   = document.getElementById("content-rep");
  const data = await apiGet({ action: "get_admin_reports" });
  if (!data.ok) { el.innerHTML = '<p style="color:var(--crimson);text-align:center;padding:20px">Failed to load reports</p>'; return; }
  reportData = data;
  renderReports();
}

function renderReports() {
  const el = document.getElementById("content-rep");
  let html = "";

  // Weekly compliance
  html += '<div style="background:var(--white);border-radius:16px;border:1.5px solid var(--border);padding:20px;margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:rgba(26,26,46,.6);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px">📅 Weekly Compliance</div>';
  if (reportData.weekly_compliance && reportData.weekly_compliance.length > 0) {
    reportData.weekly_compliance.forEach(w => {
      const pct = Math.round((w.days_filled / 7) * 100);
      const clr = pct >= 80 ? "var(--green)" : pct >= 50 ? "var(--orange)" : "var(--crimson)";
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(26,26,46,.06)">';
      html += '<div style="font-size:13px;color:var(--ink)">' + w.week + '</div>';
      html += '<div style="font-size:13px;font-weight:700;color:' + clr + '">' + w.days_filled + '/7 days (' + pct + '%)</div></div>';
    });
  } else {
    html += '<div style="font-size:13px;color:rgba(26,26,46,.5);text-align:center;padding:12px">No data yet</div>';
  }
  html += '</div>';

  // Aspect performance
  html += '<div style="background:var(--white);border-radius:16px;border:1.5px solid var(--border);padding:20px;margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:rgba(26,26,46,.6);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px">📊 Aspect Performance (30 Days)</div>';
  if (reportData.aspect_report && reportData.aspect_report.length > 0) {
    reportData.aspect_report.forEach(a => {
      const pct = (a.score / 5) * 100;
      const low = a.score < 3.5;
      html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(26,26,46,.06)">';
      html += '<div style="flex:1;font-size:13px;color:var(--ink)">' + a.aspect + '</div>';
      html += '<div style="width:100px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;flex-shrink:0"><div style="height:100%;border-radius:3px;background:' + (low ? "var(--crimson)" : "var(--gold)") + ';width:' + pct + '%"></div></div>';
      html += '<div style="font-size:13px;font-weight:700;color:' + (low ? "var(--crimson)" : "var(--navy)") + ';width:30px;text-align:right">' + a.score.toFixed(1) + '</div></div>';
    });
  } else {
    html += '<div style="font-size:13px;color:rgba(26,26,46,.5);text-align:center;padding:12px">No data yet</div>';
  }
  html += '</div>';

  // Floor comparison
  html += '<div style="background:var(--white);border-radius:16px;border:1.5px solid var(--border);padding:20px;margin-bottom:16px"><div style="font-size:12px;font-weight:700;color:rgba(26,26,46,.6);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px">🏢 Floor Comparison (4 Weeks)</div>';
  if (reportData.floor_report && reportData.floor_report.length > 0) {
    reportData.floor_report.forEach(f => {
      if (!f.weeks || f.weeks.length === 0) return;
      html += '<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px">' + f.floor + '</div><div style="display:flex;gap:6px">';
      f.weeks.forEach(w => {
        const low = w.score < 3.5;
        html += '<div style="flex:1;text-align:center"><div style="font-size:11px;font-weight:700;color:' + (low ? "var(--crimson)" : "var(--green)") + '">' + w.score.toFixed(1) + '</div>';
        html += '<div style="height:4px;border-radius:2px;background:' + (low ? "var(--crimson)" : "var(--green)") + ';margin:3px 0;opacity:.6"></div>';
        html += '<div style="font-size:9px;color:rgba(26,26,46,.3)">W' + (w.week.split("-W")[1] || w.week) + '</div></div>';
      });
      html += '</div></div>';
    });
  } else {
    html += '<div style="font-size:13px;color:rgba(26,26,46,.5);text-align:center;padding:12px">No floor data yet</div>';
  }
  html += '</div>';

  el.innerHTML = html;
}

// ── RENDER ─────────────────────────────────────────────────────
function renderDashboard() {
  const d    = dashData;
  const body = document.getElementById("body");

  const dateLabel = formatDate(d.date);

  // Overall section
  const overallDone  = d.overall_done;
  const overallScore = d.overall_score;
  const threeDayDue  = d.three_days_due;

  let overallHtml = `
    <div class="overall-card ${overallDone ? 'done' : 'pending'} fade-in">
      <div class="overall-top">
        <div class="overall-label">📋 Overall Checklist</div>
        <div class="overall-badge ${overallDone ? 'done' : 'pending'}">
          ${overallDone ? '✅ Done' : '⏳ Pending'}
        </div>
      </div>`;

  if (overallDone) {
    overallHtml += `
      <div class="overall-score-wrap">
        <div class="overall-score">${overallScore.toFixed(1)}<span> / 5</span></div>
        <div class="overall-score-sub">Today's Score</div>
      </div>`;
  }

  if (threeDayDue && !overallDone) {
    overallHtml += `
      <div class="three-day-alert">
        ⚠️ Mannequin Styling points are due today (3-day cycle)
      </div>`;
  }

  if (!overallDone) {
    overallHtml += `<button class="btn-fill" onclick="goToChecklist('overall')">Fill Overall Checklist →</button>`;
  } else {
    overallHtml += `
      <button class="btn-fill done-btn" disabled>✅ Submitted Today</button>
      <button class="btn-fill secondary" style="margin-top:8px" onclick="goToChecklist('overall')">Edit Submission</button>`;
  }

  overallHtml += `</div>`;

  // Floor section
  let floorHtml = ``;
  FLOORS.forEach(f => {
    const status = d.floor_status.find(s => s.floor === f.name);
    const done   = status && status.done;
    const score  = done ? status.score : null;
    const date   = done ? formatDateShort(status.date) : null;

    if (done) {
      floorHtml += `
        <div class="floor-card done fade-in">
          <div class="floor-icon">${f.icon}</div>
          <div class="floor-info">
            <div class="floor-name">${f.name}</div>
            <div class="floor-meta">✅ Done on ${date}</div>
          </div>
          <div class="floor-right">
            <div class="floor-score">${score.toFixed(1)}<span>/5</span></div>
          </div>
        </div>`;
    } else {
      const submitted = status ? (status.submitted || 0) : 0;
      const total     = status ? (status.total || 0) : 0;
      const partial   = submitted > 0;
      floorHtml += `
        <div class="floor-card active fade-in" onclick="goToChecklist('floor', '${f.name}')">
          <div class="floor-icon">${f.icon}</div>
          <div class="floor-info">
            <div class="floor-name">${f.name}</div>
            <div class="floor-meta">${partial ? submitted + "/" + total + " points done · Tap to continue" : "Tap to fill this week's checklist"}</div>
          </div>
          <div class="floor-right">
            ${partial ? `<div style="font-size:13px;font-weight:600;color:var(--gold)">${submitted}/${total}</div>` : `<div class="floor-arrow">›</div>`}
          </div>
        </div>`;
    }
  });

  // Week progress
  const doneCount    = d.floor_status.filter(s => s.done).length;
  const pendingCount = 5 - doneCount;

  body.innerHTML = `
    <div class="greeting fade-in">
      <div class="greeting-name">Hello, ${user.name}! 👋</div>
      <div class="greeting-date">${dateLabel}</div>
      <div class="greeting-week">
        📅 This Week: ${doneCount}/5 floors done
        ${pendingCount > 0 ? `· ${pendingCount} pending` : ' · All floors complete! 🎉'}
      </div>
    </div>

    <div class="section-title">Today's Overall</div>
    ${overallHtml}

    <div class="section-title">This Week's Floors</div>
    <div class="floor-grid">${floorHtml}</div>
  `;
}

// ── NAVIGATION ────────────────────────────────────────────────
function goToChecklist(type, floor) {
  sessionStorage.setItem("vm_checklist_type", type);
  if (floor) sessionStorage.setItem("vm_checklist_floor", floor);
  window.location.href = "vm.html";
}

function logout() {
  sessionStorage.clear();
  window.location.href = "login.html";
}

// ── SHARE REPORT ──────────────────────────────────────────────
async function shareReport() {
  const adm = adminDash || await apiGet({ action: "get_admin_dashboard", date: selectedDate });
  if (!adm || !adm.ok) { showToast("Load dashboard first", "error"); return; }
  adminDash = adm;
  showToast("Generating report...", "");

  const canvas = document.getElementById("reportCanvas");
  const ctx    = canvas.getContext("2d");
  const W = 800, H = 860;
  canvas.width = W; canvas.height = H;

  const navy="#1E2D5A",gold="#B8860B",green="#1E7A1E",crimson="#C0392B",ivory="#F9F7F0",white="#FFFFFF",ink="#1A1A2E",border="#E8E4D8";

  ctx.fillStyle = ivory; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = navy; roundRect(ctx,0,0,W,130,0); ctx.fill();
  ctx.fillStyle = white; ctx.font = "bold 26px sans-serif"; ctx.fillText("BSC Textiles — VM Report", 40, 50);
  ctx.fillStyle = "rgba(255,255,255,.65)"; ctx.font = "15px sans-serif";
  ctx.fillText(formatDate(selectedDate) + "  ·  Belagavi Store", 40, 78);
  ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = "12px sans-serif";
  ctx.fillText("Submitted by: " + (adm.submitted_by||[]).join(", ") || "Not submitted", 40, 106);

  const score = adm.overall_done ? adm.overall_score : null;
  const isGood = score !== null && score >= 3.5;
  ctx.fillStyle = white; roundRect(ctx,30,150,W-60,110,14); ctx.fill();
  ctx.strokeStyle=border; ctx.lineWidth=1.5; roundRect(ctx,30,150,W-60,110,14); ctx.stroke();
  ctx.fillStyle=ink; ctx.font="bold 13px sans-serif"; ctx.fillText("OVERALL SCORE",55,182);
  ctx.fillStyle = score===null?"#999":isGood?green:crimson;
  ctx.font="bold 58px sans-serif"; ctx.fillText(score!==null?score.toFixed(1):"—",55,248);
  ctx.fillStyle="#999"; ctx.font="20px sans-serif"; ctx.fillText("/5",score!==null?160:90,248);
  ctx.fillStyle=score===null?"#EEE":isGood?"#D1FAE5":"#FEE2E2";
  roundRect(ctx,W-220,188,170,40,20); ctx.fill();
  ctx.fillStyle=score===null?"#999":isGood?green:crimson;
  ctx.font="bold 13px sans-serif"; ctx.textAlign="center";
  ctx.fillText(score===null?"Not Submitted":isGood?"✅ On Track":"⚠️ Attention",W-135,213);
  ctx.textAlign="left";

  let y = 290;
  ctx.fillStyle=ink; ctx.font="bold 13px sans-serif"; ctx.fillText("ASPECT SCORES",40,y); y+=16;
  (adm.aspect_scores||[]).forEach(a => {
    y+=32;
    ctx.fillStyle=white; roundRect(ctx,30,y-22,W-60,30,7); ctx.fill();
    ctx.fillStyle=ink; ctx.font="12px sans-serif"; ctx.fillText(a.aspect,50,y-4);
    const bx=W-330,bw=220,low=a.score<3.5;
    ctx.fillStyle=border; roundRect(ctx,bx,y-14,bw,7,3); ctx.fill();
    ctx.fillStyle=low?crimson:gold; roundRect(ctx,bx,y-14,(a.score/5)*bw,7,3); ctx.fill();
    ctx.fillStyle=low?crimson:navy; ctx.font="bold 13px sans-serif";
    ctx.textAlign="right"; ctx.fillText(a.score.toFixed(1),W-45,y-4); ctx.textAlign="left";
  });

  y+=50;
  ctx.fillStyle=ink; ctx.font="bold 13px sans-serif"; ctx.fillText("THIS WEEK'S FLOORS",40,y); y+=16;
  const fw=(W-80)/2;
  (adm.floor_status||[]).forEach((f,i)=>{
    const fx=30+(i%2)*(fw+20), fy=y+Math.floor(i/2)*68;
    const done=f.done,partial=f.submitted>0&&!done;
    ctx.fillStyle=done?"#D1FAE5":partial?"#FEF3C7":white;
    roundRect(ctx,fx,fy+8,fw-20,52,9); ctx.fill();
    ctx.strokeStyle=done?green:partial?gold:border; ctx.lineWidth=1.5;
    roundRect(ctx,fx,fy+8,fw-20,52,9); ctx.stroke();
    ctx.fillStyle=done?green:partial?gold:"#999";
    ctx.font="bold 12px sans-serif"; ctx.fillText(f.floor,fx+10,fy+30);
    ctx.font="11px sans-serif";
    ctx.fillText(done?"✅ "+f.score.toFixed(1)+"/5":partial?f.submitted+"/"+f.total+" pts":"⏳ Pending",fx+10,fy+48);
  });

  y=H-55;
  ctx.fillStyle=navy; roundRect(ctx,0,y,W,55,0); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.55)"; ctx.font="12px sans-serif"; ctx.textAlign="center";
  ctx.fillText("Powered by C&B Consulting & Beyond",W/2,y+32); ctx.textAlign="left";

  const link=document.createElement("a");
  link.download="BSC_VM_"+selectedDate+".png";
  link.href=canvas.toDataURL("image/png"); link.click();
  setTimeout(()=>{
    const msg=encodeURIComponent("📊 *BSC VM Daily Report*\n📅 "+formatDate(selectedDate)+"\n"+(adm.overall_done?"Score: *"+adm.overall_score.toFixed(1)+"/5*":"Not submitted")+"\n_(Image attached)_");
    window.open("https://wa.me/?text="+msg,"_blank");
  },800);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// ── API ───────────────────────────────────────────────────────
function apiGet(params) {
  return new Promise((resolve) => {
    const cbName = "vmCb_" + Date.now() + "_" + (++_cbCount);
    let settled = false;
    const script = document.createElement("script");
    window[cbName] = (data) => {
      if (settled) return; settled = true;
      delete window[cbName];
      if (document.body.contains(script)) document.body.removeChild(script);
      resolve(data);
    };
    script.onerror = () => { if (settled) return; settled = true; resolve({ ok: false, error: "Network error" }); };
    setTimeout(() => { if (settled) return; settled = true; resolve({ ok: false, error: "Timeout" }); }, 15000);
    script.src = `${API}?${new URLSearchParams(params).toString()}&callback=${cbName}`;
    document.body.appendChild(script);
  });
}

// ── HELPERS ───────────────────────────────────────────────────
function formatDate(dateStr) {
  const d = new Date(dateStr);
  const days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getUTCDay()]}, ${d.getUTCDate()} ${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr);
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getUTCDay()]} ${d.getUTCDate()} ${months[d.getUTCMonth()]}`;
}

function showToast(msg, type="") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = type;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}
