<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>BSC VM — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1E2D5A;--navy-d:#151F3E;--navy-l:#EEF1FB;
  --gold:#B8860B;--gold-l:#FEF3C7;
  --crimson:#C0392B;--crimson-l:#FEE2E2;
  --green:#1E7A1E;--green-l:#D1FAE5;
  --orange:#D97706;--orange-l:#FEF3C7;
  --ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-30:rgba(26,26,46,.3);--ink-10:rgba(26,26,46,.06);
  --ivory:#F9F7F0;--white:#FFFFFF;--border:#E8E4D8;
  --shadow:0 2px 12px rgba(26,26,46,.08);--shadow-md:0 4px 24px rgba(26,26,46,.12);
}
html,body{min-height:100vh;background:var(--ivory);
  font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* ── TOPBAR ───────────────────────────────────────── */
.topbar{
  background:var(--navy);padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{
  width:34px;height:34px;border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,.15);flex-shrink:0;
}
.topbar-logo img{width:100%;height:100%;object-fit:cover}
.topbar-title{font-family:'DM Serif Display',serif;color:var(--white);font-size:16px}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.logout-btn{
  padding:6px 12px;border-radius:8px;
  background:rgba(255,255,255,.12);color:var(--white);
  font-size:12px;font-weight:600;font-family:inherit;
  border:none;cursor:pointer;
}

/* ── BODY ─────────────────────────────────────────── */
.body{padding:20px;max-width:560px;margin:0 auto}

/* ── GREETING ─────────────────────────────────────── */
.greeting{
  background:var(--navy);border-radius:18px;
  padding:24px 20px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.greeting::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.05);
}
.greeting::after{
  content:'';position:absolute;bottom:-40px;right:20px;
  width:80px;height:80px;border-radius:50%;
  background:rgba(184,134,11,.1);
}
.greeting-name{
  font-family:'DM Serif Display',serif;font-size:22px;
  color:var(--white);margin-bottom:4px;
}
.greeting-date{font-size:13px;color:rgba(255,255,255,.6)}
.greeting-week{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:12px;padding:6px 12px;border-radius:20px;
  background:rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.8);
}

/* ── SECTION TITLE ────────────────────────────────── */
.section-title{
  font-size:11px;font-weight:700;color:var(--ink-60);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── OVERALL CARD ─────────────────────────────────── */
.overall-card{
  background:var(--white);border-radius:16px;
  border:1.5px solid var(--border);padding:18px;
  margin-bottom:20px;box-shadow:var(--shadow);
}
.overall-card.done{border-color:var(--green)}
.overall-card.pending{border-color:var(--orange)}

.overall-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.overall-label{font-size:14px;font-weight:700;color:var(--ink)}
.overall-badge{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
}
.overall-badge.done{background:var(--green-l);color:var(--green)}
.overall-badge.pending{background:var(--orange-l);color:var(--orange)}

.overall-score{
  font-family:'DM Serif Display',serif;font-size:40px;
  color:var(--navy);line-height:1;
}
.overall-score span{font-size:16px;color:var(--ink-30)}
.overall-score-wrap{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.overall-score-sub{font-size:12px;color:var(--ink-60);padding-bottom:6px}

.three-day-alert{
  background:var(--orange-l);border:1px solid var(--orange);
  border-radius:10px;padding:10px 14px;
  font-size:12px;color:var(--orange);
  display:flex;align-items:center;gap:8px;margin-bottom:14px;
}

.btn-fill{
  width:100%;padding:13px;border-radius:10px;
  background:var(--navy);color:var(--white);
  font-size:14px;font-weight:700;font-family:inherit;
  border:none;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-fill:hover{background:var(--navy-d)}
.btn-fill.done-btn{background:var(--green-l);color:var(--green);cursor:default}
.btn-fill.secondary{background:var(--ivory);color:var(--navy);border:1.5px solid var(--border)}
.btn-fill.secondary:hover{background:var(--navy-l)}

/* ── FLOOR GRID ───────────────────────────────────── */
.floor-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.floor-card{
  background:var(--white);border-radius:14px;
  border:1.5px solid var(--border);padding:16px 18px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);transition:all .2s;
}
.floor-card.done{border-color:var(--green);background:var(--green-l)}
.floor-card.active{cursor:pointer}
.floor-card.active:hover{border-color:var(--navy);background:var(--navy-l)}

.floor-icon{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--ivory);
}
.floor-card.done .floor-icon{background:rgba(30,122,30,.15)}

.floor-info{flex:1}
.floor-name{font-size:14px;font-weight:600;color:var(--ink)}
.floor-card.done .floor-name{color:var(--green)}
.floor-meta{font-size:11px;color:var(--ink-60);margin-top:2px}
.floor-card.done .floor-meta{color:var(--green)}

.floor-right{flex-shrink:0;text-align:right}
.floor-score{
  font-family:'DM Serif Display',serif;font-size:20px;color:var(--green);
}
.floor-score span{font-size:11px;color:var(--green)}
.floor-arrow{font-size:18px;color:var(--ink-30)}

/* ── LOADER ───────────────────────────────────────── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite}
.loader p{font-size:13px;color:var(--ink-60)}

/* ── TOAST ────────────────────────────────────────── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--white);padding:12px 20px;border-radius:10px;
  font-size:13px;font-weight:500;z-index:999;transition:transform .3s ease;
  white-space:nowrap;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green)}
#toast.error{background:var(--crimson)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">
      <img src="https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg" alt="BSC"/>
    </div>
    <div>
      <div class="topbar-title">VM Dashboard</div>
      <div class="topbar-sub">BSC Textiles — Belagavi</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<div class="body" id="body">
  <div class="loader">
    <div class="spinner"></div>
    <p>Loading dashboard...</p>
  </div>
</div>

<div id="toast"></div>

<div style="text-align:center;padding:24px 20px 32px;border-top:1px solid #E8E4D8;margin-top:8px">
  <div style="font-size:10px;color:rgba(26,26,46,.3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">Powered by</div>
  <img src="https://bsctextilescandb-ui.github.io/retail-crm/cnb-logo.png" alt="C&amp;B" style="height:28px;opacity:.7"/>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwhLkB_Lp5t8JeM_9ZCq1onID-pDmuKdBE00aGQY6FCFljTNbFaHxOxfSpSoSKRc9xQ/exec";

const FLOORS = [
  { name:"Ground Floor", icon:"🏢" },
  { name:"1st Floor",    icon:"1️⃣" },
  { name:"2nd Floor",    icon:"2️⃣" },
  { name:"3rd Floor",    icon:"3️⃣" },
  { name:"4th Floor",    icon:"4️⃣" }
];

let user = null;
let dashData = null;

// ── INIT ──────────────────────────────────────────────────────
window.onload = () => {
  const stored = sessionStorage.getItem("vm_user");
  if (!stored) { window.location.href = "login.html"; return; }
  user = JSON.parse(stored);
  loadDashboard();
};

async function loadDashboard() {
  const data = await apiGet({ action: "get_vm_dashboard", name: user.name });
  if (!data.ok) { showToast("Failed to load dashboard", "error"); return; }
  dashData = data;
  renderDashboard();
}

// ── RENDER ─────────────────────────────────────────────────────
function renderDashboard() {
  const d    = dashData;
  const body = document.getElementById("body");

  const dateLabel = formatDate(d.date);

  // Overall section
  const overallDone  = d.overall_done;
  const overallScore = d.overall_score;
  const threeDayDue  = d.three_days_due;

  let overallHtml = `
    <div class="overall-card ${overallDone ? 'done' : 'pending'} fade-in">
      <div class="overall-top">
        <div class="overall-label">📋 Overall Checklist</div>
        <div class="overall-badge ${overallDone ? 'done' : 'pending'}">
          ${overallDone ? '✅ Done' : '⏳ Pending'}
        </div>
      </div>`;

  if (overallDone) {
    overallHtml += `
      <div class="overall-score-wrap">
        <div class="overall-score">${overallScore.toFixed(1)}<span> / 5</span></div>
        <div class="overall-score-sub">Today's Score</div>
      </div>`;
  }

  if (threeDayDue && !overallDone) {
    overallHtml += `
      <div class="three-day-alert">
        ⚠️ Mannequin Styling points are due today (3-day cycle)
      </div>`;
  }

  if (!overallDone) {
    overallHtml += `<button class="btn-fill" onclick="goToChecklist('overall')">Fill Overall Checklist →</button>`;
  } else {
    overallHtml += `
      <button class="btn-fill done-btn" disabled>✅ Submitted Today</button>
      <button class="btn-fill secondary" style="margin-top:8px" onclick="goToChecklist('overall')">Edit Submission</button>`;
  }

  overallHtml += `</div>`;

  // Floor section
  let floorHtml = ``;
  FLOORS.forEach(f => {
    const status = d.floor_status.find(s => s.floor === f.name);
    const done   = status && status.done;
    const score  = done ? status.score : null;
    const date   = done ? formatDateShort(status.date) : null;

    if (done) {
      floorHtml += `
        <div class="floor-card done fade-in">
          <div class="floor-icon">${f.icon}</div>
          <div class="floor-info">
            <div class="floor-name">${f.name}</div>
            <div class="floor-meta">✅ Done on ${date}</div>
          </div>
          <div class="floor-right">
            <div class="floor-score">${score.toFixed(1)}<span>/5</span></div>
          </div>
        </div>`;
    } else {
      const submitted = status ? (status.submitted || 0) : 0;
      const total     = status ? (status.total || 0) : 0;
      const partial   = submitted > 0;
      floorHtml += `
        <div class="floor-card active fade-in" onclick="goToChecklist('floor', '${f.name}')">
          <div class="floor-icon">${f.icon}</div>
          <div class="floor-info">
            <div class="floor-name">${f.name}</div>
            <div class="floor-meta">${partial ? submitted + "/" + total + " points done · Tap to continue" : "Tap to fill this week's checklist"}</div>
          </div>
          <div class="floor-right">
            ${partial ? `<div style="font-size:13px;font-weight:600;color:var(--gold)">${submitted}/${total}</div>` : `<div class="floor-arrow">›</div>`}
          </div>
        </div>`;
    }
  });

  // Week progress
  const doneCount    = d.floor_status.filter(s => s.done).length;
  const pendingCount = 5 - doneCount;

  body.innerHTML = `
    <div class="greeting fade-in">
      <div class="greeting-name">Hello, ${user.name}! 👋</div>
      <div class="greeting-date">${dateLabel}</div>
      <div class="greeting-week">
        📅 This Week: ${doneCount}/5 floors done
        ${pendingCount > 0 ? `· ${pendingCount} pending` : ' · All floors complete! 🎉'}
      </div>
    </div>

    <div class="section-title">Today's Overall</div>
    ${overallHtml}

    <div class="section-title">This Week's Floors</div>
    <div class="floor-grid">${floorHtml}</div>
  `;
}

// ── NAVIGATION ────────────────────────────────────────────────
function goToChecklist(type, floor) {
  sessionStorage.setItem("vm_checklist_type", type);
  if (floor) sessionStorage.setItem("vm_checklist_floor", floor);
  window.location.href = "vm.html";
}

function logout() {
  sessionStorage.clear();
  window.location.href = "login.html";
}

// ── API ───────────────────────────────────────────────────────
function apiGet(params) {
  return new Promise((resolve) => {
    const cbName = "vmCb_" + Date.now();
    const script = document.createElement("script");
    window[cbName] = (data) => {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.onerror = () => resolve({ ok: false, error: "Network error" });
    script.src = `${API}?${new URLSearchParams(params).toString()}&callback=${cbName}`;
    document.body.appendChild(script);
  });
}

// ── HELPERS ───────────────────────────────────────────────────
function formatDate(dateStr) {
  const d = new Date(dateStr);
  const days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getUTCDay()]}, ${d.getUTCDate()} ${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr);
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getUTCDay()]} ${d.getUTCDate()} ${months[d.getUTCMonth()]}`;
}

function showToast(msg, type="") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = type;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}
</script>
</body>
</html>
