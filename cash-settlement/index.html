<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BSC Belagavi — Cash Settlement</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#1E2D5A;--navy-d:#151F3E;
  --gold:#B8860B;--gold-l:#FEF3C7;
  --crimson:#C0392B;
  --ivory:#F9F7F0;
  --ink:#1A1A2E;
}
html,body{
  height:100%;
  font-family:'Cambria',Georgia,serif;
  background:var(--navy);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  overflow:hidden;
}
.wrap{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 28px;width:100%;max-width:360px;
}
.logo-box{
  width:96px;height:96px;
  background:#fff;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;
  box-shadow:0 4px 24px rgba(0,0,0,0.25);
  overflow:hidden;padding:6px;
}
.logo-box img{width:100%;height:100%;object-fit:contain;}
.store-name{
  color:#fff;font-size:24px;font-weight:700;
  letter-spacing:.5px;margin-bottom:4px;text-align:center;
  font-family:'Cambria',Georgia,serif;
}
.store-sub{
  color:rgba(255,255,255,.5);font-size:13px;
  margin-bottom:44px;text-align:center;
  font-family:'Cambria',Georgia,serif;
  letter-spacing:.3px;
}
.dots{display:flex;gap:16px;margin-bottom:10px;}
.dot{
  width:14px;height:14px;border-radius:50%;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.35);
  transition:all .15s;
}
.dot.filled{background:#fff;border-color:#fff;}
.dot.err{background:var(--crimson);border-color:var(--crimson);}
.err-msg{
  color:#ff7675;font-size:13px;text-align:center;
  height:22px;margin-bottom:20px;
  font-family:'Cambria',Georgia,serif;
}
.pad{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:14px;width:100%;max-width:280px;
}
.key{
  height:68px;border-radius:14px;border:none;
  background:rgba(255,255,255,.1);
  color:#fff;font-size:24px;
  font-family:'Cambria',Georgia,serif;
  font-weight:600;cursor:pointer;
  transition:background .1s,transform .08s;
  display:flex;align-items:center;justify-content:center;
}
.key:active{background:rgba(255,255,255,.28);transform:scale(.93);}
.key.blank{background:transparent;pointer-events:none;}
.key.del{font-size:20px;}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-10px)}
  40%,80%{transform:translateX(10px)}
}
.shake{animation:shake .38s ease;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-box">
    <img src="../logo.jpg" alt="BSC Logo" onerror="this.parentElement.innerHTML='<span style=\'font-size:28px;font-weight:900;color:#1E2D5A;\'>BSC</span>'">
  </div>
  <div class="store-name">BSC BELAGAVI</div>
  <div class="store-sub">The Textile Mall &nbsp;·&nbsp; Cash Settlement</div>

  <div class="dots" id="dots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>
  <div class="err-msg" id="errMsg"></div>

  <div class="pad">
    <button class="key" onclick="tap('1')">1</button>
    <button class="key" onclick="tap('2')">2</button>
    <button class="key" onclick="tap('3')">3</button>
    <button class="key" onclick="tap('4')">4</button>
    <button class="key" onclick="tap('5')">5</button>
    <button class="key" onclick="tap('6')">6</button>
    <button class="key" onclick="tap('7')">7</button>
    <button class="key" onclick="tap('8')">8</button>
    <button class="key" onclick="tap('9')">9</button>
    <button class="key blank"></button>
    <button class="key" onclick="tap('0')">0</button>
    <button class="key del" onclick="del()">⌫</button>
  </div>
</div>

<script>
const PIN = "1234";
const SESSION_MS = 3600000; // 1 hour
let entry = "";

function tap(d){
  if(entry.length >= 4) return;
  entry += d;
  render();
  if(entry.length === 4) verify();
}
function del(){
  entry = entry.slice(0,-1);
  render();
}
function render(){
  for(let i=0;i<4;i++){
    const dot = document.getElementById("d"+i);
    dot.className = "dot" + (i < entry.length ? " filled" : "");
  }
}
function verify(){
  if(entry === PIN){
    sessionStorage.setItem("bsc_auth", Date.now().toString());
    window.location.href = "form.html";
  } else {
    document.getElementById("errMsg").textContent = "Incorrect PIN. Try again.";
    const dotsEl = document.getElementById("dots");
    dotsEl.classList.add("shake");
    for(let i=0;i<4;i++) document.getElementById("d"+i).className="dot err";
    setTimeout(()=>{
      dotsEl.classList.remove("shake");
      entry = ""; render();
      document.getElementById("errMsg").textContent = "";
    }, 850);
  }
}
// If already authenticated, skip to form
const t = sessionStorage.getItem("bsc_auth");
if(t && (Date.now() - parseInt(t)) < SESSION_MS){
  window.location.href = "form.html";
}
</script>
</body>
</html>
