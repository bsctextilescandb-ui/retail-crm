<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MRM Report — BSC The Textile Mall</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Cambria,Georgia,serif}
:root{
  --navy:#1E2D5A;--navy-d:#151F3E;--navy-l:#EEF1FB;
  --gold:#B8860B;--gold-l:#FEF3C7;
  --crimson:#C0392B;--crimson-l:#FEE2E2;
  --green:#1E7A1E;--green-l:#D1FAE5;
  --orange:#B45309;--orange-l:#FEF3C7;
  --ink:#1A1A2E;--ink-60:rgba(26,26,46,.6);--ink-30:rgba(26,26,46,.3);
  --ivory:#F9F7F0;--white:#fff;--surface:#F3F1E8;--border:#E8E4D8;
}
html,body{min-height:100vh;background:var(--ivory);color:var(--ink)}

/* ── Password Screen ── */
#pwScreen{
  position:fixed;inset:0;background:var(--navy);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:1000;gap:16px}
.pw-logo{width:72px;height:72px;background:var(--white);border-radius:16px;
  overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.pw-logo img{width:100%;height:100%;object-fit:contain}
.pw-title{font-size:22px;font-weight:700;color:var(--white)}
.pw-sub{font-size:12px;color:rgba(255,255,255,.45);text-transform:uppercase;
  letter-spacing:.12em;margin-bottom:8px}
.pw-label{font-size:12px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em}
.pw-input{padding:12px 18px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:var(--white);font-size:16px;
  font-family:Cambria,Georgia,serif;width:260px;text-align:center;letter-spacing:.1em}
.pw-input:focus{outline:none;border-color:var(--gold)}
.pw-input::placeholder{color:rgba(255,255,255,.3);letter-spacing:0}
.pw-btn{padding:12px 32px;border-radius:10px;background:var(--gold);
  color:var(--white);font-size:14px;font-weight:700;border:0;cursor:pointer;
  font-family:Cambria,Georgia,serif;width:260px}
.pw-btn:hover{background:var(--gold-d,#8B6508)}
.pw-error{font-size:13px;color:#f87171;height:18px;font-style:italic}
@keyframes shake{
  0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s ease}

/* ── Date Picker Screen ── */
#dateScreen{
  position:fixed;inset:0;background:var(--navy);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:999;gap:16px;display:none}
.ds-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);
  border-radius:16px;padding:32px;width:360px;display:flex;flex-direction:column;gap:14px}
.ds-title{font-size:20px;font-weight:700;color:var(--white);text-align:center}
.ds-sub{font-size:12px;color:rgba(255,255,255,.45);text-align:center;margin-top:-8px}
.ds-field{display:flex;flex-direction:column;gap:6px}
.ds-label{font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.09em}
.ds-input{padding:10px 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:var(--white);font-size:14px;
  font-family:Cambria,Georgia,serif}
.ds-input:focus{outline:none;border-color:var(--gold)}
.ds-row{display:flex;gap:10px}
.ds-preset{flex:1;padding:8px;border-radius:7px;font-size:12px;font-weight:500;
  border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.7);cursor:pointer;text-align:center}
.ds-preset:hover{background:rgba(255,255,255,.15);color:var(--white)}
.ds-generate{padding:13px;border-radius:10px;background:var(--gold);
  color:var(--white);font-size:14px;font-weight:700;border:0;cursor:pointer;
  font-family:Cambria,Georgia,serif;width:100%}
.ds-skip{font-size:12px;color:rgba(255,255,255,.4);text-align:center;
  cursor:pointer;text-decoration:underline}
.ds-skip:hover{color:rgba(255,255,255,.7)}

/* ── Report ── */
#report{display:none;max-width:900px;margin:0 auto;padding:24px}

/* ── Top controls ── */
.report-controls{background:var(--white);border-radius:12px;border:1px solid var(--border);
  padding:14px 20px;margin-bottom:24px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(26,26,46,.06)}
.rc-label{font-size:13px;color:var(--ink-60)}
.rc-input{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;
  font-size:13px;font-family:Cambria,Georgia,serif;color:var(--ink)}
.rc-input:focus{outline:none;border-color:var(--navy)}
.rc-btn{padding:8px 18px;border-radius:8px;border:0;cursor:pointer;
  font-size:13px;font-weight:600;font-family:Cambria,Georgia,serif}
.rc-btn.primary{background:var(--navy);color:var(--white)}
.rc-btn.secondary{background:var(--gold);color:var(--white)}
.rc-btn.print{background:var(--green);color:var(--white)}
.rc-preset{padding:6px 12px;border-radius:6px;border:1.5px solid var(--border);
  font-size:12px;cursor:pointer;background:var(--white);color:var(--ink-60)}
.rc-preset:hover{background:var(--surface)}

/* ── Pages ── */
.page{background:var(--white);border-radius:12px;border:1px solid var(--border);
  margin-bottom:24px;overflow:hidden;box-shadow:0 2px 12px rgba(26,26,46,.06)}
.page-header{background:#1E2D5A!important;padding:16px 24px;
  border-bottom:3px solid #B8860B;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.page-header-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.5);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.page-header-name{font-size:20px;font-weight:700;color:var(--white)}
.page-body{padding:24px}

/* ── Cover page ── */
.cover-page{background:#1E2D5A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  border-radius:12px;padding:60px 40px;text-align:center;margin-bottom:24px;
  border:3px solid #B8860B;box-shadow:0 4px 24px rgba(26,26,46,.15)}
.cover-logos{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:32px}
.cover-logo{width:64px;height:64px;border-radius:12px;background:#fff;overflow:hidden}
.cover-logo img{width:100%;height:100%;object-fit:contain}
.cover-title{font-size:32px;font-weight:700;color:#ffffff!important;margin-bottom:8px}
.cover-sub{font-size:16px;color:#e0e0e0!important;margin-bottom:6px;font-weight:500}
.cover-period{font-size:16px;color:#B8860B!important;font-weight:700;margin-bottom:32px}
.cover-meta{font-size:13px;color:#cccccc!important;font-weight:500}

/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#F3F1E8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  border-radius:10px;padding:14px 16px;border-left:4px solid #1E2D5A}
.stat-card.green{border-left-color:#1E7A1E}
.stat-card.gold{border-left-color:#B8860B}
.stat-card.crimson{border-left-color:#C0392B}
.stat-card.orange{border-left-color:#B45309}
.sc-label{font-size:10px;font-weight:700;color:#555555!important;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.sc-value{font-size:26px;font-weight:700;color:#1A1A2E!important;line-height:1}
.sc-change{font-size:11px;margin-top:4px;font-weight:600}
.sc-change.up{color:#1E7A1E!important}
.sc-change.down{color:#C0392B!important}
.sc-change.neutral{color:#444444!important}

/* ── Health score ── */
.health-row{display:flex;align-items:center;gap:20px;
  background:#EDEAE0!important;border-radius:10px;padding:16px 20px;margin-bottom:20px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.health-circle{width:80px;height:80px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:4px solid;flex-shrink:0}
.health-num{font-size:24px;font-weight:700;line-height:1}
.health-den{font-size:10px;color:var(--ink-60)}
.health-text{flex:1}
.health-verdict{font-size:16px;font-weight:700;margin-bottom:4px}
.health-desc{font-size:12px;color:var(--ink-60);line-height:1.4}

/* ── Section headers ── */
.section-title{font-size:13px;font-weight:700;color:#1E2D5A!important;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;
  padding-bottom:8px;border-bottom:2px solid #D5D1C8}

/* ── Wins / Actions ── */
.win-item{display:flex;align-items:flex-start;gap:10px;
  padding:10px 14px;border-radius:8px;margin-bottom:8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.win-item.green{background:#C8F0C8!important}
.win-item.red{background:#F5C6C0!important}
.win-item.gold{background:#F5E6A0!important}
.win-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.win-text{font-size:13px;color:var(--ink);line-height:1.4}
.win-sub{font-size:11px;color:var(--ink-60);margin-top:2px}

/* ── Bar chart ── */
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bc-row{display:flex;align-items:center;gap:10px}
.bc-label{font-size:12px;color:var(--ink-60);width:90px;text-align:right;flex-shrink:0}
.bc-track{flex:1;height:22px;background:#E0DDD5!important;border-radius:4px;overflow:hidden;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.bc-fill{height:100%;border-radius:4px;background:#1E2D5A!important;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.bc-val{font-size:12px;font-weight:600;color:var(--ink);width:50px;flex-shrink:0}

/* ── Q analysis ── */
.q-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;
  padding:10px 14px;background:#EDEAE0!important;border-radius:8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.q-name{font-size:13px;color:var(--ink);flex:1;font-weight:500}
.q-pct{font-size:13px;font-weight:700;width:45px;text-align:right}
.q-bar-wrap{width:120px;flex-shrink:0}
.q-bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.q-bar-fill{height:100%;border-radius:4px}
.q-status{font-size:11px;width:60px;flex-shrink:0;text-align:right}

/* ── Voice quotes ── */
.voice-quote{background:#FEF3C7!important;border-left:4px solid #B8860B;
  padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:10px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.vq-num{font-size:10px;font-weight:700;color:#B8860B;text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:5px}
.vq-text{font-size:12px;color:#1A1A2E!important;line-height:1.6;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vq-text.full{display:block;-webkit-line-clamp:unset}
.vq-meta{font-size:11px;color:#555555!important;margin-top:7px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vq-meta-dot{color:#9CA3AF}
.concern-quote{background:#FEE2E2!important;border-left:4px solid #C0392B;
  padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:10px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.vq-more{text-align:center;font-size:12px;color:#9CA3AF;
  padding:8px;border-radius:6px;background:#F3F1E8;margin-top:4px}

/* ── Theme pills ── */
.theme-grid{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.theme-pill{padding:8px 16px;border-radius:7px;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.theme-pill.concern{background:#FEE2E2!important;color:#C0392B}
.theme-pill.positive{background:#D1FAE5!important;color:#1E7A1E}
.theme-pill-count{margin-left:auto;font-size:11px;opacity:.8}

/* ── Funnel ── */
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;
  padding:10px 16px;background:#EDEAE0!important;border-radius:8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.fn-label{font-size:13px;color:var(--ink);flex:1}
.fn-val{font-size:18px;font-weight:700;color:var(--ink)}
.fn-pct{font-size:11px;color:var(--ink-60);width:50px;text-align:right}
.fn-arrow{font-size:18px;color:var(--ink-30)}

/* ── Table ── */
.mrm-table{width:100%;border-collapse:collapse}
.mrm-table th{background:#1E2D5A!important;color:#ffffff!important;
  padding:10px 14px;font-size:12px;font-weight:600;text-align:left;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.mrm-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid #D5D1C8;color:#1A1A2E!important}
.mrm-table tr:nth-child(even) td{background:#EDEAE0!important;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── Target table ── */
.target-row{display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-radius:8px;margin-bottom:8px;background:#EDEAE0!important;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.tr-metric{font-size:13px;font-weight:500;color:var(--ink);flex:1}
.tr-current{font-size:13px;color:var(--ink-60);width:80px;text-align:center}
.tr-target{font-size:13px;font-weight:700;color:var(--navy);width:80px;text-align:center}
.tr-gap{font-size:12px;width:80px;text-align:center;padding:3px 8px;border-radius:999px}

/* ── Loading ── */
.report-loading{text-align:center;padding:60px 24px;color:var(--ink-60)}
.rl-spinner{width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--navy);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Print ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .report-controls{display:none!important}
  #pwScreen,#dateScreen{display:none!important}

  /* Each section starts on a new PDF page */
  .page{
    box-shadow:none!important;
    border:1px solid #D5D1C8!important;
    margin:0!important;
    page-break-before:always!important;
    break-before:always!important;
    page-break-inside:auto!important;
    break-inside:auto!important;
  }

  /* Cover page — always starts fresh, next page also fresh */
  .cover-page{
    page-break-before:always!important;
    break-before:always!important;
    page-break-after:always!important;
    break-after:always!important;
    background:#1E2D5A!important;
    margin:0!important;
  }

  /* First page — no top break needed */
  .cover-page:first-child{
    page-break-before:avoid!important;
    break-before:avoid!important;
  }

  body{background:#ffffff!important;padding:0!important}
  #report{padding:0!important}
  .stat-grid{grid-template-columns:repeat(4,1fr)!important}
  .stat-grid-3{grid-template-columns:repeat(3,1fr)!important}
  .impact-grid{grid-template-columns:repeat(3,1fr)!important}
  .page-header-title{color:rgba(255,255,255,.8)!important}
  .page-header-name{color:#ffffff!important}

  /* Content inside page can flow naturally across PDF pages */
  .page-body{page-break-inside:auto!important;break-inside:auto!important}
  .voice-quote,.concern-quote{page-break-inside:avoid!important;break-inside:avoid!important}
  .stat-card{page-break-inside:avoid!important;break-inside:avoid!important}
  .health-row{page-break-inside:avoid!important;break-inside:avoid!important}
}
</style>
<script>
function checkPW(){
  var val=(document.getElementById("pwInput").value||"").trim();
  if(val==="BSCCANDB"){
    try{localStorage.setItem("bsc_mrm_unlocked","1");}catch(e){}
    document.getElementById("pwScreen").style.display="none";
    showDateScreen();
  } else {
    var wrap=document.getElementById("pwInputWrap");
    if(wrap){wrap.classList.add("shake");setTimeout(function(){wrap.classList.remove("shake");},400);}
    document.getElementById("pwError").textContent="Incorrect password. Try again.";
    document.getElementById("pwInput").value="";
  }
}
</script>
</head>
<body>

<!-- Password Screen -->
<div id="pwScreen">
  <div class="pw-logo">
    <img src="https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg" alt="BSC"/>
  </div>
  <div class="pw-title">BSC The Textile Mall</div>
  <div class="pw-sub">Monthly Review Meeting Report</div>
  <div class="pw-label">Enter Password</div>
  <div id="pwInputWrap">
    <input class="pw-input" type="password" id="pwInput"
      placeholder="Enter password" onkeydown="if(event.key==='Enter')window.checkPW&&window.checkPW()"/>
  </div>
  <button class="pw-btn" onclick="checkPW()">Access Report</button>
  <div class="pw-error" id="pwError"></div>
</div>

<!-- Date Picker Screen -->
<div id="dateScreen">
  <div class="ds-card">
    <div class="ds-title">Generate MRM Report</div>
    <div class="ds-sub">Select the period for the report</div>

    <!-- Preset buttons -->
    <div class="ds-row">
      <div class="ds-preset" onclick="setPreset('lastMonth')">Last Month</div>
      <div class="ds-preset" onclick="setPreset('thisMonth')">This Month</div>
      <div class="ds-preset" onclick="setPreset('lastQuarter')">Last Quarter</div>
    </div>

    <div class="ds-field">
      <div class="ds-label">From Date</div>
      <input class="ds-input" type="date" id="dsFrom"/>
    </div>
    <div class="ds-field">
      <div class="ds-label">To Date</div>
      <input class="ds-input" type="date" id="dsTo"/>
    </div>

    <button class="ds-generate" onclick="generateReport()">📋 Generate Report</button>
    <div class="ds-skip" onclick="generateReport(true)">Skip date filter — show all data</div>
  </div>
</div>

<!-- Report -->
<div id="report"></div>

<script>
/* ── Config ── */
var API_URL = "https://bsc-crm.bsctextiles-candb.workers.dev/";
var PASSWORD  = "BSCCANDB";
var PW_KEY    = "bsc_mrm_unlocked";

/* ── Password ── */
function checkPW(){
  var val = (document.getElementById("pwInput").value||"").trim();
  if(val === PASSWORD){
    try{localStorage.setItem(PW_KEY,"1");}catch(e){}
    document.getElementById("pwScreen").style.display = "none";
    showDateScreen();
  } else {
    var wrap = document.getElementById("pwInputWrap");
    if(wrap){wrap.classList.add("shake");setTimeout(function(){wrap.classList.remove("shake");},400);}
    document.getElementById("pwError").textContent = "Incorrect password. Try again.";
    document.getElementById("pwInput").value = "";
  }
}

function showDateScreen(){
  var ds = document.getElementById("dateScreen");
  ds.style.display = "flex";
  // Default to last month
  setPreset("lastMonth");
}

/* ── Presets ── */
function setPreset(preset){
  var now = new Date();
  var from, to;
  if(preset === "lastMonth"){
    from = new Date(now.getFullYear(), now.getMonth()-1, 1);
    to   = new Date(now.getFullYear(), now.getMonth(), 0);
  } else if(preset === "thisMonth"){
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to   = new Date(now);
  } else if(preset === "lastQuarter"){
    var q = Math.floor(now.getMonth()/3);
    from  = new Date(now.getFullYear(), (q-1)*3, 1);
    to    = new Date(now.getFullYear(), q*3, 0);
  }
  document.getElementById("dsFrom").value = toInputDate(from);
  document.getElementById("dsTo").value   = toInputDate(to);
}

function toInputDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* ── Boot ── */
(function(){
  var ok = false;
  try{ok = localStorage.getItem(PW_KEY)==="1";}catch(e){}
  if(ok){
    document.getElementById("pwScreen").style.display="none";
    showDateScreen();
  }
  document.getElementById("pwInput").addEventListener("keydown",function(e){
    if(e.key==="Enter") checkPW();
  });
})();

/* ── Data ── */
var DATA = { footfall:[], feedback:[], diverts:[], daily:[], callLog:[], questions:[] };
var PERIOD = { from:null, to:null, label:"" };

function api(body){
  var token = "";
  try{
    token = sessionStorage.getItem("crm_token") ||
            localStorage.getItem("bsc_tv_token") || "";
  }catch(e){}
  body.token = token;
  return fetch(API_URL,{method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(body)}).then(function(r){return r.json();})
  .catch(function(){return {ok:false,error:"Connection error"};});
}

function apiWithFallback(body){
  return api(body).then(function(res){
    if(res.ok) return res;
    // Token expired — try tv_auth to get fresh token
    return fetch(API_URL,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"tv_auth"})})
    .then(function(r){return r.json();})
    .then(function(r2){
      if(r2.ok){

/* ── Date helpers ── */
function parseDate(str){
  if(!str) return null;
  var s=String(str).trim();
  if(/^\d{2}\/\d{2}\/\d{4}/.test(s)){
    var p=s.slice(0,10).split("/");
    return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  }
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s.slice(0,10));
  return null;
}
function inRange(dateStr){
  if(!PERIOD.from || !PERIOD.to) return true;
  var d = parseDate(dateStr);
  if(!d) return false;
  return d >= PERIOD.from && d <= PERIOD.to;
}
function fmtDisp(d){ return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}); }
function fmtKey(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function p2(n){ return String(n).padStart(2,"0"); }

/* ── Filtered data ── */
function ff()  { return DATA.footfall.filter(function(r){return inRange(r.date);}); }
function fb()  { return DATA.feedback.filter(function(r){return inRange(r.date);}); }
function div() { return DATA.diverts.filter(function(r){return inRange(r.date);}); }
function dly() { return DATA.daily.filter(function(r){return inRange(r.date);}); }

/* ── Metric helpers ── */
function totalFF(){ return ff().reduce(function(s,r){return s+(Number(r.count)||0);},0); }
function totalBills(){ return dly().reduce(function(s,r){return s+(Number(r.bills_count)||0);},0); }
function convPct(){ var f=totalFF(); return f>0?Math.round((totalBills()/f)*100):0; }

var NEG_MAP = {
  q2_overall_experience:["Average","Needs Improvement"],
  q3_staff_behaviour:["Average","Not Satisfactory"],
  q4_product_variety:["Limited Options","Did Not Find It"],
  q5_pricing_value:["Slightly High","Too Expensive"],
  q6_visit_again:["No"]
};
var Q_LABELS = {
  q2_overall_experience:"Overall Experience",
  q3_staff_behaviour:"Staff Behaviour",
  q4_product_variety:"Product Variety",
  q5_pricing_value:"Pricing & Value",
  q6_visit_again:"Visit Again?"
};

function isNeg(f){
  return Object.keys(NEG_MAP).some(function(k){
    return NEG_MAP[k].indexOf(String(f[k]||"").trim())!==-1;
  });
}

function calcCSI(feedbacks){
  var sm={
    "Excellent":4,"Good":3,"Average":2,"Needs Improvement":1,
    "Very Clear & Helpful":4,"Helpful":3,"Average":2,"Not Satisfactory":1,
    "Very Satisfied":4,"Satisfied":3,"Limited Options":2,"Did Not Find It":1,
    "Great Value":4,"Reasonable":3,"Slightly High":2,"Too Expensive":1
  };
  var keys=["q2_overall_experience","q3_staff_behaviour","q4_product_variety","q5_pricing_value"];
  var tot=0,mx=0,cnt=0;
  feedbacks.forEach(function(f){
    var rs=0,rm=0,has=false;
    keys.forEach(function(k){
      var v=String(f[k]||"").trim();
      if(v&&sm[v]!==undefined){rs+=sm[v];rm+=4;has=true;}
    });
    if(has){tot+=rs;mx+=rm;cnt++;}
  });
  return {score:mx>0?Math.round((tot/mx)*100):null,count:cnt};
}

function calcNPS(feedbacks){
  var p=0,pa=0,d=0;
  feedbacks.forEach(function(f){
    var v=String(f.q6_visit_again||f.q6||"").trim();
    if(v==="Definitely Yes"||v==="Yes") p++;
    else if(v==="Maybe") pa++;
    else if(v==="No") d++;
  });
  var t=p+pa+d;
  return {score:t>0?Math.round(((p-d)/t)*100):null,promoters:p,passives:pa,detractors:d,total:t};
}

function divertRate(){
  var f=totalFF();
  return f>0?parseFloat(((div().length/f)*100).toFixed(2)):0;
}

/* ── Theme detection ── */
/* ── Theme detection — based on Q answers not keywords ── */
function detectThemes(feedbacks){
  var themes = [];

  // CONCERN themes — based on negative Q answers
  var staffNeg = feedbacks.filter(function(f){
    return NEG_MAP.q3_staff_behaviour.indexOf(String(f.q3_staff_behaviour||"").trim()) !== -1;
  }).length;

  var pricingNeg = feedbacks.filter(function(f){
    return NEG_MAP.q5_pricing_value.indexOf(String(f.q5_pricing_value||"").trim()) !== -1;
  }).length;

  var varietyNeg = feedbacks.filter(function(f){
    return NEG_MAP.q4_product_variety.indexOf(String(f.q4_product_variety||"").trim()) !== -1;
  }).length;

  var experienceNeg = feedbacks.filter(function(f){
    return NEG_MAP.q2_overall_experience.indexOf(String(f.q2_overall_experience||"").trim()) !== -1;
  }).length;

  var visitNeg = feedbacks.filter(function(f){
    return NEG_MAP.q6_visit_again.indexOf(String(f.q6_visit_again||"").trim()) !== -1;
  }).length;

  // POSITIVE themes — based on positive Q answers
  var staffPos = feedbacks.filter(function(f){
    var v = String(f.q3_staff_behaviour||"").trim();
    return v === "Very Clear & Helpful" || v === "Helpful";
  }).length;

  var experiencePos = feedbacks.filter(function(f){
    var v = String(f.q2_overall_experience||"").trim();
    return v === "Excellent" || v === "Good";
  }).length;

  var visitPos = feedbacks.filter(function(f){
    var v = String(f.q6_visit_again||"").trim();
    return v === "Definitely Yes" || v === "Yes";
  }).length;

  var varietyPos = feedbacks.filter(function(f){
    var v = String(f.q4_product_variety||"").trim();
    return v === "Very Satisfied" || v === "Satisfied";
  }).length;

  // Build concern themes
  if(staffNeg>0)       themes.push({label:"Staff Behaviour Issues",   count:staffNeg,       type:"concern"});
  if(pricingNeg>0)     themes.push({label:"Pricing Concerns",          count:pricingNeg,     type:"concern"});
  if(varietyNeg>0)     themes.push({label:"Product Variety Issues",    count:varietyNeg,     type:"concern"});
  if(experienceNeg>0)  themes.push({label:"Poor Overall Experience",   count:experienceNeg,  type:"concern"});
  if(visitNeg>0)       themes.push({label:"Will Not Visit Again",      count:visitNeg,       type:"concern"});

  // Build positive themes
  if(staffPos>0)       themes.push({label:"Excellent Staff Behaviour", count:staffPos,       type:"positive"});
  if(experiencePos>0)  themes.push({label:"Great Overall Experience",  count:experiencePos,  type:"positive"});
  if(visitPos>0)       themes.push({label:"Will Visit Again",          count:visitPos,       type:"positive"});
  if(varietyPos>0)     themes.push({label:"Happy with Product Range",  count:varietyPos,     type:"positive"});

  // Sort — concerns first by count, then positives by count
  var concerns  = themes.filter(function(t){return t.type==="concern";}).sort(function(a,b){return b.count-a.count;});
  var positives = themes.filter(function(t){return t.type==="positive";}).sort(function(a,b){return b.count-a.count;});

  return concerns.concat(positives).filter(function(t){return t.count>0;});
}

/* ── Health score ── */
function calcHealth(csi, nps, cv, dr){
  var scores = [];
  // Footfall trend — always 60 base (no prev period in MRM)
  scores.push({s:60, w:20});
  // Conversion
  var cvS = cv>=90?100:cv>=70?70:cv>=50?40:20;
  scores.push({s:cvS, w:20});
  // CSI
  var csiS = csi===null?50:csi>=80?100:csi>=65?70:csi>=50?40:20;
  scores.push({s:csiS, w:20});
  // NPS
  var npsS = nps===null?50:nps>=95?100:nps>=50?70:nps>=0?40:20;
  scores.push({s:npsS, w:15});
  // Feedback volume — base 70
  scores.push({s:70, w:10});
  // Divert rate
  var drS = dr<=2?100:dr<=5?80:dr<=10?50:20;
  scores.push({s:drS, w:15});
  var tot=0,mx=0;
  scores.forEach(function(x){tot+=x.s*x.w;mx+=x.w*100;});
  return Math.round((tot/mx)*100);
}

function feedbackJourney(all, neg, pos){
  var negMobile = neg.filter(function(f){return String(f.cust_mobile||"").length>=10;});
  var callData  = DATA.callLog || [];

  // Get latest call status per feedback_id from call_log
  var latestCallMap = {};
  callData.forEach(function(l){
    var fid = l.feedback_id;
    if(!latestCallMap[fid]) latestCallMap[fid] = l;
    else {
      // Keep latest by call_at timestamp
      if((l.call_at||"") > (latestCallMap[fid].call_at||"")) latestCallMap[fid] = l;
    }
  });

  // Negative feedback with mobile
  var negMobileIds = negMobile.map(function(f){return f.feedback_id;});

  // Count by latest status
  var resolved=0, willVisit=0, noAnswer=0, notReachable=0, notSatisfied=0, pending=0;
  negMobile.forEach(function(f){
    var latest = latestCallMap[f.feedback_id];
    if(!latest){
      pending++;
    } else {
      var s = latest.call_status||"";
      if(s==="issue_resolved")                                   resolved++;
      else if(s==="will_visit")                                  willVisit++;
      else if(s==="closed_no_response"||s==="no_answer")         noAnswer++;
      else if(s==="closed_not_reachable"||s==="not_reachable")   notReachable++;
      else if(s==="not_satisfied")                               notSatisfied++;
      else                                                        pending++;
    }
  });

  // Thanked — positive feedback called
  var thanked = pos.filter(function(f){ var l=latestCallMap[f.feedback_id]; return l&&l.call_status==="thanked"; }).length;
  var posPending = pos.filter(function(f){ return !latestCallMap[f.feedback_id]; }).length;

  var recoveryRate = negMobile.length>0 ? Math.round(((resolved+willVisit)/negMobile.length)*100) : 0;

  var html="";

  // Total
  html+='<div class="funnel-row"><div class="fn-label">📋 Total Feedbacks</div><div class="fn-val">'+all.length+'</div><div class="fn-pct">100%</div></div>';
  html+='<div style="text-align:center;font-size:18px;color:var(--ink-30);margin:4px 0">↓</div>';

  // Negative
  html+='<div class="funnel-row" style="background:var(--crimson-l)"><div class="fn-label">🔴 Negative Feedbacks</div><div class="fn-val" style="color:var(--crimson)">'+neg.length+'</div><div class="fn-pct">'+Math.round((neg.length/(all.length||1))*100)+'%</div></div>';
  html+='<div class="funnel-row" style="margin-left:20px"><div class="fn-label">📞 With Mobile (Callable)</div><div class="fn-val">'+negMobile.length+'</div><div class="fn-pct">'+Math.round((negMobile.length/(neg.length||1))*100)+'%</div></div>';

  // Call outcomes
  html+='<div style="margin-left:40px">';
  html+='<div class="funnel-row" style="background:var(--green-l);margin-bottom:4px"><div class="fn-label">✅ Issue Resolved</div><div class="fn-val" style="color:var(--green)">'+resolved+'</div><div class="fn-pct">'+Math.round((resolved/(negMobile.length||1))*100)+'%</div></div>';
  html+='<div class="funnel-row" style="background:var(--navy-l);margin-bottom:4px"><div class="fn-label">🔵 Will Visit Again</div><div class="fn-val" style="color:var(--navy)">'+willVisit+'</div><div class="fn-pct">'+Math.round((willVisit/(negMobile.length||1))*100)+'%</div></div>';
  html+='<div class="funnel-row" style="background:var(--gold-l);margin-bottom:4px"><div class="fn-label">📵 No Answer / Closed</div><div class="fn-val" style="color:var(--gold)">'+noAnswer+'</div><div class="fn-pct">'+Math.round((noAnswer/(negMobile.length||1))*100)+'%</div></div>';
  html+='<div class="funnel-row" style="background:var(--surface);margin-bottom:4px"><div class="fn-label">📵 Not Reachable</div><div class="fn-val">'+notReachable+'</div><div class="fn-pct">'+Math.round((notReachable/(negMobile.length||1))*100)+'%</div></div>';
  if(notSatisfied>0)
    html+='<div class="funnel-row" style="background:var(--crimson-l);margin-bottom:4px"><div class="fn-label">⚠️ Still Not Satisfied</div><div class="fn-val" style="color:var(--crimson)">'+notSatisfied+'</div><div class="fn-pct">'+Math.round((notSatisfied/(negMobile.length||1))*100)+'%</div></div>';
  html+='<div class="funnel-row" style="background:var(--surface);margin-bottom:4px"><div class="fn-label">⏳ Pending Call</div><div class="fn-val" style="color:var(--ink-60)">'+pending+'</div><div class="fn-pct">'+Math.round((pending/(negMobile.length||1))*100)+'%</div></div>';
  html+='</div>';

  // Recovery rate
  var rrColor = recoveryRate>=60?"var(--green)":recoveryRate>=40?"var(--gold)":"var(--crimson)";
  html+='<div style="margin:8px 0 4px;padding:12px 16px;border-radius:8px;background:'+rrColor+'22;border-left:4px solid '+rrColor+'">' +
    '<div style="font-size:13px;font-weight:700;color:'+rrColor+'">Recovery Rate: '+recoveryRate+'%</div>' +
    '<div style="font-size:11px;color:var(--ink-60);margin-top:2px">'+(resolved+willVisit)+' of '+negMobile.length+' negative customers resolved or will revisit</div>' +
  '</div>';

  html+='<div style="text-align:center;font-size:18px;color:var(--ink-30);margin:4px 0">↓</div>';

  // Positive
  html+='<div class="funnel-row" style="background:var(--green-l)"><div class="fn-label">🟢 Positive Feedbacks</div><div class="fn-val" style="color:var(--green)">'+pos.length+'</div><div class="fn-pct">'+Math.round((pos.length/(all.length||1))*100)+'%</div></div>';
  if(thanked>0)
    html+='<div class="funnel-row" style="margin-left:20px;background:var(--green-l)"><div class="fn-label">✅ Thanked</div><div class="fn-val" style="color:var(--green)">'+thanked+'</div><div class="fn-pct">'+Math.round((thanked/(pos.length||1))*100)+'%</div></div>';
  if(posPending>0)
    html+='<div class="funnel-row" style="margin-left:20px"><div class="fn-label">⏳ Pending Thank You Call</div><div class="fn-val" style="color:var(--ink-60)">'+posPending+'</div><div class="fn-pct">'+Math.round((posPending/(pos.length||1))*100)+'%</div></div>';

  return html;
}

  var reportDiv = document.getElementById("report").innerHTML;
  var styles    = document.querySelector("style").outerHTML;

  var period = PERIOD.label.replace(/[^a-zA-Z0-9\-]/g,"_");
  var filename = "BSC_MRM_Report_"+period+".html";

  var fullHTML = '<!DOCTYPE html><html lang="en"><head>' +
    '<meta charset="UTF-8"/>' +
    '<meta name="viewport" content="width=device-width, initial-scale=1"/>' +
    '<title>MRM Report — BSC The Textile Mall — '+esc(PERIOD.label)+'</title>' +
    styles +
    '</head><body style="background:var(--ivory);padding:24px">' +
    '<div style="max-width:900px;margin:0 auto">' +
    '<div style="background:var(--white);border-radius:12px;border:1px solid var(--border);' +
      'padding:14px 20px;margin-bottom:24px;display:flex;align-items:center;gap:10px">' +
      '<span style="font-size:13px;color:var(--ink-60)">BSC The Textile Mall — MRM Report — '+esc(PERIOD.label)+'</span>' +
      '<span style="margin-left:auto;font-size:12px;color:var(--ink-30)">Generated: '+fmtDisp(new Date())+'</span>' +
    '</div>' +
    reportDiv +
    '</div></body></html>';

  var blob = new Blob([fullHTML], {type:"text/html;charset=utf-8"});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href     = url;
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ── Save as PDF ── */
function savePDF(){
  // Set print-friendly title and trigger browser print
  var orig = document.title;
  var period = PERIOD.label;
  document.title = "BSC_MRM_Report_"+period.replace(/[^a-zA-Z0-9\-]/g,"_");
  window.print();
  document.title = orig;
}

/* ── Re-generate from controls ── */
function rcPreset(preset){
  document.getElementById("dsFrom").value = document.getElementById("dsFrom")?document.getElementById("dsFrom").value:"";
  setPreset(preset);
  document.getElementById("rcFrom").value = document.getElementById("dsFrom").value;
  document.getElementById("rcTo").value   = document.getElementById("dsTo").value;
}

function rcGenerate(){
  var f=document.getElementById("rcFrom").value;
  var t=document.getElementById("rcTo").value;
  document.getElementById("dsFrom").value=f;
  document.getElementById("dsTo").value=t;
  generateReport(false);
}
</script>
